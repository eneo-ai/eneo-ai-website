<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-labelledby="t d">
  <title id="t">Eneo, flöden och moduler</title>
  <desc id="d">Tre lager: Eneo är AI-motorn i kärnan, flöden är de sekventiella assistenterna runt motorn, moduler är gränssnittet ytterst.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#055594"/>
      <stop offset="1" stop-color="#1a7ad4"/>
    </linearGradient>
  </defs>
  <style>
    .name { font-family: 'Newsreader', Georgia, serif; font-weight: 600; font-size: 20px; fill: #1a1f2e; }
    .role { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 1px; fill: #8896a8; }
    .body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 14px; fill: #5a6578; }
    .head { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 600; font-size: 15px; fill: #1a1f2e; }
  </style>
  <rect width="900" height="420" fill="#ffffff"/>

  <!-- Moduler -->
  <rect x="30" y="30" width="400" height="360" rx="24" fill="#ffffff" stroke="rgba(0,0,0,0.12)"/>
  <text x="54" y="66" class="name">Moduler</text>
  <text x="406" y="64" class="role" text-anchor="end">GRÄNSSNITTET</text>

  <!-- Flöden -->
  <rect x="60" y="90" width="340" height="270" rx="20" fill="rgba(5,85,148,0.07)" stroke="rgba(5,85,148,0.3)"/>
  <text x="84" y="126" class="name">Flöden</text>
  <text x="376" y="124" class="role" text-anchor="end">SEKVENTIELLA ASSISTENTER</text>

  <!-- Eneo -->
  <rect x="100" y="160" width="260" height="160" rx="18" fill="url(#g)"/>
  <text x="230" y="238" class="name" fill="#ffffff" text-anchor="middle" style="fill:#fff">Eneo</text>
  <text x="230" y="262" class="role" text-anchor="middle" style="fill:rgba(255,255,255,0.8)">AI-MOTORN</text>

  <!-- Legend -->
  <g transform="translate(480 50)">
    <rect x="0" y="4" width="3" height="78" fill="#8896a8"/>
    <text x="18" y="20" class="head">Eneo, AI-motorn</text>
    <text x="18" y="44" class="body">Modeller för språk, transkribering och sökning.</text>
    <text x="18" y="64" class="body">Kunskapskällor. Ytor med behörigheter.</text>
    <text x="18" y="84" class="body">Säkerhetsklassificering. Revisionslogg och API.</text>
  </g>
  <g transform="translate(480 165)">
    <rect x="0" y="4" width="3" height="78" fill="#1a7ad4"/>
    <text x="18" y="20" class="head">Flöden, sekventiella assistenter</text>
    <text x="18" y="44" class="body">Steg i fast ordning. Publicerade, oföränderliga versioner.</text>
    <text x="18" y="64" class="body">Körningar med bevisunderlag. Granskningspunkter.</text>
    <text x="18" y="84" class="body">Export och import som paket.</text>
  </g>
  <g transform="translate(480 280)">
    <rect x="0" y="4" width="3" height="78" fill="#38bdf8"/>
    <text x="18" y="20" class="head">Moduler, gränssnittet</text>
    <text x="18" y="44" class="body">En webbapp per arbetsmoment, på egen domän. Inloggning via Eneo.</text>
    <text x="18" y="64" class="body">Kör publicerade flöden och visar resultatet.</text>
    <text x="18" y="84" class="body">Tal till text är den första.</text>
  </g>
</svg>
